<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visor de aterrizaje de cohete — 2D y 3D</title>
<style>
  :root { --bg:#0d1321; --panel:#151c2e; --line:#2a3350; --text:#e6e9f0; --dim:#8a93a8;
          --blue:#4cc9f0; --orange:#ff9f1c; --green:#80ed99; --red:#ff5d73; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
               font:14px/1.45 system-ui, "Segoe UI", Roboto, sans-serif; }
  #app { display:grid; grid-template-rows:auto 1fr auto; height:100%; }
  header { padding:10px 14px 8px; background:var(--panel); border-bottom:1px solid var(--line); }
  .fila { display:flex; flex-wrap:wrap; gap:8px 22px; align-items:center; }
  .grupo { display:flex; align-items:center; gap:6px; }
  .grupo > span { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.06em; margin-right:2px; }
  button, select { font:inherit; color:var(--text); background:#1d2640; border:1px solid var(--line);
                   border-radius:6px; padding:5px 11px; cursor:pointer; }
  button:hover, select:hover { border-color:var(--blue); }
  button.on { background:var(--blue); color:#06141c; border-color:var(--blue); font-weight:600; }
  button:disabled { opacity:.35; cursor:default; }
  #desc { margin-top:6px; color:var(--dim); font-size:13px; max-width:1100px; }
  #desc b { color:var(--text); }
  main { position:relative; display:flex; min-height:0; }
  .panel { position:relative; flex:1; min-width:0; min-height:0; }
  .panel + .panel { border-left:1px solid var(--line); }
  canvas { display:block; width:100%; height:100%; }
  .oculto { display:none !important; }
  #hud { position:absolute; left:12px; top:12px; background:rgba(13,19,33,.78); border:1px solid var(--line);
         border-radius:8px; padding:8px 12px; font:12.5px/1.55 ui-monospace, Consolas, monospace; pointer-events:none;
         min-width:215px; }
  #hud .k { color:var(--dim); } #hud .v { float:right; margin-left:14px; }
  #motor { margin-top:4px; padding-top:4px; border-top:1px solid var(--line); font-weight:700; }
  #banner { position:absolute; left:50%; top:16px; transform:translateX(-50%); padding:8px 20px; border-radius:8px;
            font-weight:700; font-size:18px; letter-spacing:.04em; background:rgba(13,19,33,.85); pointer-events:none; }
  #aviso { position:absolute; left:12px; bottom:10px; color:var(--dim); font-size:12px; pointer-events:none; }
  footer { display:flex; align-items:center; gap:12px; padding:8px 14px; background:var(--panel); border-top:1px solid var(--line); }
  #barra { flex:1; accent-color:var(--blue); }
  #tiempo { font:13px ui-monospace, Consolas, monospace; color:var(--dim); min-width:130px; text-align:right; }
  #err3d { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center;
           padding:30px; color:var(--orange); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="fila">
      <div class="grupo"><span>Fase</span><span id="botones-fase" class="grupo"></span></div>
      <div class="grupo"><span>Vista</span>
        <button data-vista="2d">2D</button><button data-vista="3d">3D</button><button data-vista="ambas">2D + 3D</button></div>
      <div class="grupo" id="g-camara"><span>Cámara 3D</span>
        <button data-cam="sigue">Sigue al cohete</button><button data-cam="general">General</button><button data-cam="suelo">Desde la plataforma</button></div>
    </div>
    <div id="desc"></div>
  </header>

  <main>
    <div class="panel" id="p3d"><canvas id="c3d"></canvas></div>
    <div class="panel" id="p2d"><canvas id="c2d"></canvas></div>
    <div id="hud"></div>
    <div id="banner" class="oculto"></div>
    <div id="aviso"></div>
  </main>

  <footer>
    <button id="btn-play">Pausa</button>
    <button id="btn-reinicio">Reiniciar</button>
    <div class="grupo"><span>Velocidad</span>
      <select id="vel"><option value="0.25">0,25×</option><option value="0.5">0,5×</option>
        <option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></div>
    <input id="barra" type="range" min="0" max="1000" value="0">
    <div id="tiempo"></div>
  </footer>
</div>

  if (S.aero) h += fila(S.tresd ? "aletas (eje 1 / eje 2)" : "aletas", fmt(e.u * 180 / Math.PI) + "°" + (S.tresd ? " / " + fmt(e.u2 * 180 / Math.PI) + "°" : ""));

  h += `<div id="motor" style="color:${enc ? "var(--orange)" : "var(--dim)"}">${enc ? "MOTOR ENCENDIDO" : "MOTOR APAGADO"}</div>`;
  $("#hud").innerHTML = h;

let ultimo = performance.now();
function bucle(ahora) {

  document.querySelectorAll("[data-fase]").forEach((b) => b.classList.toggle("on", +b.dataset.fase === i));
  const r = S.ok ? "aterrizaje correcto" : "fallo";
  $("#desc").innerHTML = `<b>${S.titulo}.</b> ${S.descripcion} <span style="color:var(--dim)">(${r}; ${S.combustible_gastado} kg de combustible` +
    (S.t_ignicion != null ? `; motor encendido a los ${S.t_ignicion.toFixed(1)} s` : "") + ")</span>";
  cargarTrayectoria3D(); colocarCamara(true);
}

// ----------------------------------------------------------------- arranque
DATOS.forEach((d, i) => { const b = document.createElement("button"); b.dataset.fase = i; b.textContent = "Fase " + d.fase; b.onclick = () => ponerFase(i); $("#botones-fase").appendChild(b); });
document.querySelectorAll("[data-vista]").forEach((b) => (b.onclick = () => ponerVista(b.dataset.vista)));
document.querySelectorAll("[data-cam]").forEach((b) => (b.onclick = () => ponerCamara(b.dataset.cam)));
$("#btn-play").onclick = () => { if (t >= S.t[S.t.length - 1] - 1e-6) { t = 0; reproduciendo = true; } else reproduciendo = !reproduciendo; };
$("#btn-reinicio").onclick = () => { t = 0; reproduciendo = true; };
$("#vel").onchange = (ev) => (vel = +ev.target.value);
$("#barra").oninput = (ev) => { t = (+ev.target.value / 1000) * S.t[S.t.length - 1]; reproduciendo = false; };

gl3d = iniciar3D();
if (!gl3d) {
  $("#p3d").innerHTML = '<div id="err3d">Este navegador no puede mostrar gráficos 3D (WebGL). La vista 2D funciona igualmente.</div>';
  document.querySelectorAll('[data-vista="3d"],[data-vista="ambas"],[data-cam]').forEach((b) => (b.disabled = true));
}
ponerVista(gl3d ? "ambas" : "2d"); ponerFase(fase); ponerCamara("sigue");
$("#aviso").textContent = gl3d ? "3D: arrastra para girar · rueda para acercar · clic derecho para mover" : "";
requestAnimationFrame(bucle);
</script>
</body>
</html>
