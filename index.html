<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aterriza tú el cohete</title>
<style>
  :root { --bg:#0d1321; --panel:#151c2e; --line:#2a3350; --text:#e6e9f0; --dim:#8a93a8;
          --blue:#4cc9f0; --orange:#ff9f1c; --green:#80ed99; --red:#ff5d73; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
               font:14px/1.45 system-ui, "Segoe UI", Roboto, sans-serif; overflow:hidden; }
  #app { display:grid; grid-template-rows:auto 1fr auto; height:100%; }
  header { padding:8px 14px; background:var(--panel); border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:8px 20px; align-items:center; }
  header h1 { font-size:15px; margin:0; letter-spacing:.02em; }
  .grupo { display:flex; align-items:center; gap:6px; }
  .grupo > span { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.06em; }
  button, select { font:inherit; color:var(--text); background:#1d2640; border:1px solid var(--line);
                   border-radius:6px; padding:5px 11px; cursor:pointer; touch-action:manipulation; user-select:none; }
  button:hover, select:hover { border-color:var(--blue); }
  button.on { background:var(--blue); color:#06141c; border-color:var(--blue); font-weight:600; }
  main { position:relative; min-height:0; }
  canvas { display:block; width:100%; height:100%; }
  #hud { position:absolute; left:12px; top:12px; background:rgba(13,19,33,.78); border:1px solid var(--line);
         border-radius:8px; padding:8px 12px; font:12.5px/1.55 ui-monospace, Consolas, monospace; pointer-events:none; min-width:225px; }
  #hud .k { color:var(--dim); } #hud .v { float:right; margin-left:14px; }
  #motor { margin-top:4px; padding-top:4px; border-top:1px solid var(--line); font-weight:700; }
  #gauge { position:absolute; left:12px; bottom:12px; width:225px; background:rgba(13,19,33,.78); border:1px solid var(--line);
           border-radius:8px; padding:8px 12px; font-size:12px; pointer-events:none; }
  #gauge .barra { height:10px; border-radius:5px; background:#232b44; margin:5px 0 4px; overflow:hidden; }
  #gauge .rell { height:100%; width:0; background:var(--green); }
  #consejo { font-weight:700; min-height:1.4em; }
  #cartel { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(13,19,33,.84); padding:16px; }
  #caja { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:20px 26px; max-width:640px; width:100%; max-height:100%; overflow:auto; }
  #caja h2 { margin:0 0 8px; font-size:20px; }
  #caja table { width:100%; border-collapse:collapse; margin:10px 0; font-size:13px; }
  #caja th, #caja td { text-align:right; padding:4px 8px; border-bottom:1px solid var(--line); }
  #caja th:first-child, #caja td:first-child { text-align:left; color:var(--dim); }
  .bien { color:var(--green); } .mal { color:var(--red); }
  kbd { background:#1d2640; border:1px solid var(--line); border-bottom-width:2px; border-radius:4px; padding:0 6px; font:12px ui-monospace, Consolas, monospace; }
  #caja p { margin:6px 0; color:var(--text); }
  #caja .dim { color:var(--dim); font-size:13px; }
  #caja button.grande { margin-top:10px; padding:8px 20px; font-size:15px; background:var(--blue); color:#06141c; border-color:var(--blue); font-weight:700; }
  footer { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; padding:8px 14px; background:var(--panel); border-top:1px solid var(--line); }
  footer button { min-width:92px; padding:9px 12px; }
  .oculto { display:none !important; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Aterriza tú el cohete</h1>
    <div class="grupo"><span>Dificultad</span>
      <button data-modo="facil">Fácil</button><button data-modo="asistido">Asistido</button><button data-modo="experto">Experto</button>
    </div>
    <div class="grupo"><span>Velocidad</span>
      <select id="vel"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select>
    </div>
    <div class="grupo"><span>Ayudas</span><button id="btn-ayuda" class="on">Sí</button></div>
    <div class="grupo"><button id="btn-pausa">Pausa</button><button id="btn-reiniciar">Reiniciar</button></div>
  </header>
  <main>
    <canvas id="c"></canvas>
    <div id="hud"></div>
    <div id="gauge">
      <div>Frenada: velocidad actual / máxima que aún se puede frenar</div>
      <div class="barra"><div class="rell" id="rell"></div></div>
      <div id="consejo"></div>
    </div>
    <div id="cartel"><div id="caja"></div></div>
  </main>
  <footer id="tactil">
    <button data-tecla="Space">Motor</button>
    <button data-tecla="ArrowUp">Gas +</button>
    <button data-tecla="ArrowDown">Gas −</button>
    <button data-tecla="ArrowLeft">◀ Izquierda</button>
    <button data-tecla="ArrowRight">Derecha ▶</button>
  </footer>
</div>

  const cel = (ok, txt) => `<td class="${ok ? "bien" : "mal"}">${txt}</td>`;
  const mejor = r.mejor ? `<p class="dim">Tu mejor aterrizaje correcto: ${r.mejor.comb.toFixed(0)} kg de combustible (${r.mejor.modo}).</p>` : "";
  let veredicto = r.ok ? (r.comb <= g.combustible ? "¡Has aterrizado y has gastado menos combustible que el piloto automático!" : "¡Aterrizaje correcto!") : "Fallo: " + r.motivos.join(", ") + ".";
  $("#caja").innerHTML = `<h2 class="${r.ok ? "bien" : "mal"}">${r.ok ? "ATERRIZAJE CORRECTO" : "FALLO"}</h2>
    <p>${veredicto}</p>
    <table><tr><th></th><th>Tú</th><th>Piloto automático</th><th>Límite</th></tr>
    <tr><td>Velocidad vertical</td>${cel(Math.abs(r.vz) <= LIMITES.vz, f(r.vz) + " m/s")}<td>${f(g.vz)} m/s</td><td>±2,5</td></tr>
    <tr><td>Velocidad lateral</td>${cel(Math.abs(r.vx) <= LIMITES.vx, f(r.vx) + " m/s")}<td>${f(g.vx)} m/s</td><td>±1,0</td></tr>
    <tr><td>Inclinación</td>${cel(Math.abs(r.th) <= LIMITES.th, f(r.th * 180 / Math.PI, 1) + "°")}<td>${f(g.th * 180 / Math.PI, 1)}°</td><td>±5°</td></tr>
    <tr><td>Distancia al centro</td>${cel(Math.abs(r.x) <= LIMITES.x, f(r.x, 1) + " m")}<td>${f(g.x, 1)} m</td><td>±5 m</td></tr>
    <tr><td>Combustible gastado</td><td>${r.comb.toFixed(0)} kg</td><td>${g.combustible.toFixed(0)} kg</td><td>—</td></tr>
    <tr><td>Encendido del motor</td><td>${r.ign === null ? "nunca" : r.ign.toFixed(1) + " s"}</td><td>${g.t_ign.toFixed(1)} s</td><td>—</td></tr></table>
    ${mejor}
    <button class="grande" id="ir">Intentarlo otra vez (Intro)</button>`;
  $("#ir").onclick = empezar; $("#cartel").classList.remove("oculto");
}

// =====================================================================  DIBUJO (2D)
const cv = $("#c"), ctx = cv.getContext("2d");
function fantasmaEn(tt) {
  const F = FANTASMA, n = F.t.length;
  if (tt >= F.t[n - 1]) return { x: F.x[n - 1], z: F.z[n - 1], th: F.th[n - 1], gas: 0, dl: 0 };
  let lo = 0, hi = n - 1; while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (F.t[mid] <= tt) lo = mid; else hi = mid; }
  const a = (tt - F.t[lo]) / (F.t[hi] - F.t[lo]), L = (k) => F[k][lo] + (F[k][hi] - F[k][lo]) * a;
  return { x: L("x"), z: L("z"), th: L("th"), gas: F.gas[lo], dl: F.dl[lo] };
}
function formaCohete(x, z, th, gas, dl) {
  const L = P.L, w = P.D * 1.6, c = Math.cos(th), sn = Math.sin(th);
  const g = (p) => [x + p[0] * c + p[1] * sn, z - p[0] * sn + p[1] * c];
  const cuerpo = [[-w / 2, 0], [w / 2, 0], [w / 2, L * .88], [0, L], [-w / 2, L * .88]].map(g);
  const patas = [[-w / 2, 3], [-w * 2, -1.5], [-w / 2, 7], [w / 2, 7], [w * 2, -1.5], [w / 2, 3]].map(g);
  const lf = (6 + 20 * gas) * (0.92 + 0.16 * Math.random()), cd = Math.cos(-dl), sd = Math.sin(-dl);
  const llama = gas > 0.001 ? [[-w / 3, 0], [w / 3, 0], [0, -lf]].map((p) => [p[0] * cd + p[1] * sd, -p[0] * sd + p[1] * cd]).map(g) : null;
  return { cuerpo, patas, llama };
}
function dibujar() {
  const dpr = devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const [x, z, vx, vz, th, om, m] = s;
  const yb = Math.max(z - 35, -12), span = 95, esc = H / span;
  const X = (a) => W / 2 + (a - x) * esc, Y = (b) => H - (b - yb) * esc;
  ctx.fillStyle = "#151c2e"; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = "#232b44"; ctx.lineWidth = 1; ctx.fillStyle = "#5c6580"; ctx.font = "11px system-ui";
  for (let y = Math.ceil(yb / 20) * 20; y < yb + span; y += 20) { ctx.beginPath(); ctx.moveTo(0, Y(y)); ctx.lineTo(W, Y(y)); ctx.stroke(); ctx.fillText(y + " m", W - 52, Y(y) - 3); }
  const x0 = x - W / 2 / esc, x1 = x + W / 2 / esc;
  for (let a = Math.ceil(x0 / 20) * 20; a < x1; a += 20) { ctx.beginPath(); ctx.moveTo(X(a), 0); ctx.lineTo(X(a), H); ctx.stroke(); }
  if (Y(0) < H) { ctx.fillStyle = "#1d2a1f"; ctx.fillRect(0, Y(0), W, H - Y(0)); }
  ctx.fillStyle = "#80ed99"; ctx.fillRect(X(-5), Y(0), 10 * esc, Math.max(4, 0.6 * esc));
  const poli = (pts, color, alfa = 1) => { ctx.globalAlpha = alfa; ctx.beginPath(); pts.forEach((p, i) => (i ? ctx.lineTo(X(p[0]), Y(p[1])) : ctx.moveTo(X(p[0]), Y(p[1])))); ctx.closePath(); ctx.fillStyle = color; ctx.fill(); ctx.globalAlpha = 1; };
  // fantasma (piloto automático) a la misma hora
  const gh = fantasmaEn(t), fg = formaCohete(gh.x, gh.z, gh.th, gh.gas, gh.dl);
  if (fg.llama) poli(fg.llama, "#ff9f1c", .25);
  poli(fg.patas, "#7d869c", .3); poli(fg.cuerpo, "#9aa4c0", .3);
  // tu cohete
  const f = formaCohete(x, z, th, gasAplicado, dlAplicado);
  if (f.llama) poli(f.llama, "#ff9f1c"); poli(f.patas, "#7d869c"); poli(f.cuerpo, "#e6e9f0");
  // flecha de viento
  ctx.fillStyle = "#8a93a8"; ctx.font = "12px system-ui"; ctx.fillText("viento " + (vAplicado || vientoEn(t)).toFixed(1) + " m/s " + (vientoEn(t) >= 0 ? "→" : "←"), W / 2 - 40, 22);
  // mini-mapa
  const mw = Math.min(190, W * 0.28), mh = Math.min(250, H * 0.45), mx = W - mw - 12, my = H - mh - 12;
  ctx.fillStyle = "rgba(13,19,33,.82)"; ctx.fillRect(mx, my, mw, mh); ctx.strokeStyle = "#2a3350"; ctx.strokeRect(mx, my, mw, mh);
  const xm = Math.max(150, ...rastro.map((p) => Math.abs(p[0]))) * 1.15, zm = 2600;
  const MX = (a) => mx + mw / 2 + (a / xm) * (mw / 2 - 8), MY = (b) => my + mh - 8 - (Math.max(b, 0) / zm) * (mh - 16);
  ctx.lineWidth = 1.2; ctx.strokeStyle = "#7d869c"; ctx.setLineDash([3, 3]); ctx.beginPath();
  FANTASMA.x.forEach((a, i) => (i ? ctx.lineTo : ctx.moveTo).call(ctx, MX(a), MY(FANTASMA.z[i]))); ctx.stroke(); ctx.setLineDash([]);
  ctx.strokeStyle = "#4cc9f0"; ctx.lineWidth = 1.6; ctx.beginPath();
  rastro.forEach((p, i) => (i ? ctx.lineTo : ctx.moveTo).call(ctx, MX(p[0]), MY(p[1]))); ctx.lineTo(MX(x), MY(z)); ctx.stroke();
  ctx.fillStyle = "#80ed99"; ctx.fillRect(MX(-5), MY(0) - 2, MX(5) - MX(-5), 3);
  ctx.fillStyle = "#ff9f1c"; ctx.beginPath(); ctx.arc(MX(x), MY(z), 4, 0, 7); ctx.fill();
  ctx.fillStyle = "#8a93a8"; ctx.font = "11px system-ui"; ctx.fillText("tú (azul) · piloto (gris)", mx + 8, my + 14);
  if (pausa) { ctx.fillStyle = "rgba(13,19,33,.55)"; ctx.fillRect(0, 0, W, H); ctx.fillStyle = "#e6e9f0"; ctx.font = "bold 28px system-ui"; ctx.fillText("PAUSA", W / 2 - 45, H / 2); }
}

function hud() {
  const [x, z, vx, vz, th, om, m] = s, fila = (k, v) => `<div><span class="k">${k}</span><span class="v">${v}</span></div>`, fmt = (v, d = 1) => (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(d);
  let h = fila("tiempo", t.toFixed(1) + " s") + fila("altura", z.toFixed(0) + " m") + fila("vel. vertical", fmt(vz) + " m/s") + fila("vel. lateral", fmt(vx) + " m/s") +
    fila("posición x", fmt(x, 0) + " m") + fila("inclinación", fmt(th * 180 / Math.PI) + "°") + fila("gas", motor ? (100 * clip(gasObj, P.gasMin, 1)).toFixed(0) + " %" : "—") +
    fila("combustible", Math.max(m - P.seca, 0).toFixed(0) + " kg");
  if (modo === "asistido") h += fila("inclinación pedida", fmt(thRef * 180 / Math.PI) + "°");
  h += `<div id="motor" style="color:${motor && m > P.seca ? "var(--orange)" : "var(--dim)"}">${motor ? (m > P.seca ? "MOTOR ENCENDIDO" : "SIN COMBUSTIBLE") : "MOTOR APAGADO"}</div>`;
  $("#hud").innerHTML = h;
  // medidor de frenada: velocidad actual frente a la máxima que aún se podría frenar con el perfil del piloto (11 m/s²)
  const vmax = Math.sqrt(1 + 2 * 11 * Math.max(z, 0)), r = Math.max(-vz, 0) / vmax;
  $("#gauge").classList.toggle("oculto", !ayuda);
  $("#rell").style.width = Math.min(100, r * 100) + "%"; $("#rell").style.background = motor ? (r <= 1.05 ? "var(--green)" : "var(--red)") : (r < 0.85 ? "var(--green)" : r < 0.97 ? "var(--orange)" : "var(--red)");
  let c = "", col = "var(--dim)";
  if (!motor && r >= 0.97) { c = "¡ENCIENDE EL MOTOR YA!"; col = "var(--red)"; }
  else if (!motor && r >= 0.85) { c = "Prepárate para encender"; col = "var(--orange)"; }
  else if (!motor) { c = "Cayendo: aún hay margen"; }
  else if (r > 1.02) { c = "Frenas poco: ¡más gas!"; col = "var(--red)"; }
  else if (r < 0.9 && z > 30 && vz < -3) { c = "Frenas de sobra: puedes bajar gas"; col = "var(--green)"; }
  else { c = "Buena frenada"; col = "var(--green)"; }
  $("#consejo").textContent = c; $("#consejo").style.color = col;
}

// =====================================================================  BUCLE
function bucle(ahora) {
  const dt = Math.min((ahora - tUlt) / 1000, 0.1); tUlt = ahora;
  if (jugando && !pausa) {
    repetirGas(dt);
    acc += dt * +$("#vel").value;
    let n = 0; while (acc >= DT && jugando && n++ < 2000) { pasoJuego(); acc -= DT; }
  }
  dibujar(); hud(); requestAnimationFrame(bucle);
}
reiniciar(); gasAplicado = 0; dlAplicado = 0; marcarModo(); mostrarInicio();
requestAnimationFrame(bucle);
window.__juego = { get modo() { return modo; }, get s() { return s; }, get t() { return t; }, get resultado() { return resultado; }, get jugando() { return jugando; }, empezar, pulsar,
  poner(o) { if (o.motor !== undefined) motor = o.motor; if (o.gas !== undefined) gasObj = o.gas; if (o.modo) modo = o.modo; if (o.th !== undefined) thRef = o.th; if (o.ign !== undefined && o.ign && ign === null) ign = t; } };
</script>
